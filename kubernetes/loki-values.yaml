deploymentMode: Monolithic
singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  allocatedMemory: 256
resultsCache:
  allocatedMemory: 256
loki: 
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: nile-k8s-loki-logs-nilesh
      ruler: nile-k8s-loki-logs-nilesh
      admin: nile-k8s-loki-logs-nilesh
    s3:
      region: ap-south-1 
      # Credentials are supplied through loki-secrets.yaml
      s3ForcePathStyle: false