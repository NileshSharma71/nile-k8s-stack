apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-k8s-reader
  namespace: mcp-system

# ============================================================
# JUICE SHOP
# ============================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-k8s-reader
  namespace: juice-shop
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
      - configmaps
    verbs: [get, list, watch]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: [get, list, watch]

  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - configauditreports
      - exposedsecretreports
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-k8s-reader
  namespace: juice-shop
subjects:
  - kind: ServiceAccount
    name: mcp-k8s-reader
    namespace: mcp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-k8s-reader

